<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pastelería Delicia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <!-- Menú superior: Navbar + Offcanvas -->
  <nav class="navbar navbar-expand-md bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand" href="#">Delicia</a>
      <div class="d-flex align-items-center gap-2 order-md-last">
        <button class="btn btn-outline-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#carrito" aria-controls="carrito">
          Carrito <span class="badge text-bg-primary" id="contador">0</span>
        </button>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu" aria-controls="menu" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
      <div class="offcanvas offcanvas-end" tabindex="-1" id="menu" aria-labelledby="menuTitulo">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="menuTitulo">Menú</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="#catalogo">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link" href="#pedido">Torta personalizada</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1>Pastelería Delicia</h1>
    <p class="text-secondary">Elige tus favoritos y arma tu pedido.</p>

    <!-- Buscador y filtros -->
    <section id="catalogo" class="py-4">
      <input class="form-control mb-4" id="buscar" type="search" placeholder="Buscar producto…" aria-label="Buscar producto">
      <ul class="nav nav-pills mb-4" id="filtros"></ul>
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="productos"></div>
    </section>

    <!-- Pedido especial -->
    <section id="pedido" class="py-4">
      <h2 class="h3">Torta personalizada</h2>
      <form id="formPedido" class="row g-3">
        <div class="col-md-6"><input class="form-control" id="nombre" placeholder="Tu nombre" required></div>
        <div class="col-md-6"><input class="form-control" id="sabor" placeholder="Sabor y mensaje de la torta" required></div>
        <div class="col-12"><button class="btn btn-primary" type="submit">Enviar pedido</button></div>
      </form>
      <div class="alert alert-success mt-4" id="alertaPedido" role="alert" hidden>¡Pedido recibido! Te contactaremos pronto.</div>
    </section>
  </main>

  <!-- Carrito: Offcanvas + List group -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="carrito" aria-labelledby="carritoTitulo">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="carritoTitulo">Tu carrito</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="list-group" id="listaCarrito"></ul>
      <p class="mt-4 mb-1">Subtotal: <strong id="subtotal">S/ 0.00</strong></p>
      <p class="text-secondary mb-1" id="descuento"></p>
      <p class="fs-5">Total: <strong id="total">S/ 0.00</strong></p>
      <button class="btn btn-outline-danger" id="vaciar" type="button">Vaciar carrito</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast align-items-center text-bg-primary border-0" id="aviso" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="avisoTexto"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/tienda.js"></script>
</body>
</html>
